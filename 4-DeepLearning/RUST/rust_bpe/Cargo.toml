[package]
name = "rust_bpe"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rust_bpe"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27.0"
candle-core = { version = "0.9.0", features = ["metal", "accelerate"]}
candle-nn = { version = "0.9.0" }
regex = "1.10"
rayon = "1.9"
fancy-regex = "0.13" # Supporte le look-around de GPT
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# ... autres dépendances
